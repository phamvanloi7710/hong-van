<mat-toolbar class="top-toolbar">
  <hv-admin-brand [compact]="compactBrand()" />

  <div class="toolbar-primary-actions">
    @if (verticalMenu()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Mở hoặc đóng menu"
        (click)="toggleMenu.emit()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <button
        mat-icon-button
        class="pin-button"
        type="button"
        [attr.aria-label]="pinned() ? 'Bỏ ghim menu' : 'Ghim menu'"
        (click)="togglePinned.emit()"
      >
        <svg class="pin" viewBox="0 0 24 24" aria-hidden="true">
          @if (pinned()) {
            <path
              d="M2 5.27 3.28 4 20 20.72 18.73 22 12.8 16.07V22h-1.6v-6H6v-2l2-2v-.73L2 5.27M16 12l2 2v2h-.18L8 6.18V4H7V2h10v2h-1v8Z"
            />
          } @else {
            <path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2Z" />
          }
        </svg>
      </button>
      <button mat-icon-button type="button" class="desktop-action" aria-label="Mở thông tin nhanh">
        <mat-icon>expand_more</mat-icon>
      </button>
      <button mat-icon-button type="button" class="favorite-action" aria-label="Mục yêu thích">
        <mat-icon>favorite</mat-icon>
      </button>
    }
  </div>

  <div class="toolbar-spacer"></div>

  <div class="search" [class.opened]="searchOpened()">
    <label class="visually-hidden" for="admin-search">Tìm kiếm trong trang quản trị</label>
    <input id="admin-search" type="search" placeholder="Tìm kiếm..." />
    <button mat-icon-button type="button" aria-label="Tìm kiếm" (click)="toggleSearch()">
      <mat-icon>search</mat-icon>
    </button>
  </div>

  <button mat-icon-button type="button" aria-label="Toàn màn hình" (click)="toggleFullscreen()">
    <mat-icon>fullscreen</mat-icon>
  </button>
  <button mat-icon-button type="button" class="desktop-action" aria-label="Ứng dụng">
    <mat-icon>apps</mat-icon>
  </button>
  <button mat-icon-button type="button" aria-label="Thông báo">
    <mat-icon>notifications</mat-icon>
  </button>
  <button
    mat-icon-button
    type="button"
    class="user-button"
    aria-label="Tài khoản"
    [matMenuTriggerFor]="userMenu"
  >
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <button mat-menu-item type="button" disabled>
      <mat-icon>person</mat-icon>
      <span>{{ authStore.user()?.name ?? 'Quản trị viên' }}</span>
    </button>
    <button mat-menu-item type="button" (click)="logout()" [disabled]="logoutPending()">
      <mat-icon>logout</mat-icon>
      <span>{{ logoutPending() ? 'Đang đăng xuất…' : 'Đăng xuất' }}</span>
    </button>
  </mat-menu>
  @if (logoutError()) {
    <span class="logout-error" role="alert">{{ logoutError() }}</span>
  }
</mat-toolbar>
